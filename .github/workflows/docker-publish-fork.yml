name: Docker Build & Publish (Fork)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag (e.g. 3.8.8-fix1)'
        required: true
        default: 'latest'
  push:
    branches:
      - ci/docker-publish
      - release/*

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repo
        id: repo
        run: echo "image=${{ env.REGISTRY }}/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/omniroute" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner-base
          push: true
          tags: |
            ${{ steps.repo.outputs.image }}:${{ inputs.tag || github.ref_name }}
            ${{ steps.repo.outputs.image }}:${{ inputs.tag || github.ref_name }}-${{ github.run_number }}
